<main>
<div id="macro-root"></div><div id="personal-root" hidden></div><div id="legacy" hidden>
<div class="datebar"><button class="arrow" id="prev" aria-label="Ngày trước">‹</button><label class="datelabel"><span id="today"></span><input type="date" id="date" aria-label="Chọn ngày xem nhật ký"></label><span class="today-tag" id="today-tag">Hôm nay</span><button class="arrow" id="next" aria-label="Ngày sau">›</button></div>
<div class="layout" id="log-screen"><section class="dashboard" aria-label="Năng lượng trong ngày">
<div class="cardtop"><span>Năng lượng <button id="method" class="query" aria-label="Cách tính calo">?</button></span><span>Trong ngày</span></div>
<div class="energy"><strong id="total">0</strong> kcal</div>
<div class="indicators"><span><b class="meal-dot">●</b><span id="count">0 bữa đã ghi</span></span><span><b class="gram-dot">g</b><span id="grams">0 g</span></span></div>
<figure class="duck-figure"><div class="mascot-stage duck-portrait duck-window"><img id="journal-duck" src="art/duck/hungry.webp" alt="Vịt đang chờ bữa đầu tiên"></div><figcaption id="journal-duck-caption"></figcaption></figure>
<p class="card-caption" id="caption">Bạn đã ghi 0 bữa trong ngày</p>
<div class="breakdown" id="breakdown"></div>
</section>
<div class="side"><section class="capture"><div class="camera-copy"><div class="ai-title"><i data-icon="spark"></i> Nhận diện bằng AI</div><h1>Ghi bữa ăn</h1></div><div class="actions"><button class="primary" id="shoot"><i data-icon="camera"></i>Chụp món ăn</button><button class="secondary" id="pick"><i data-icon="image"></i>Chọn ảnh</button></div></section>
<section class="journal"><div class="journal-head"><h2>Bữa đã ghi</h2><i data-icon="book"></i></div><div id="entries" aria-live="polite"></div></section></div></div>
<section id="stats-screen" class="stats" hidden><h2>Năng lượng trong 7 ngày</h2><p id="stats-range"></p><div id="chart"></div><div class="week-total"><span>Tổng năng lượng</span><strong id="week-total"></strong></div></section>
</div><footer><i data-icon="lock"></i> Nhật ký lưu trên thiết bị này</footer></main>
<input type="file" accept="image/*" capture="environment" id="camera" hidden><input type="file" accept="image/*" id="gallery" hidden>
<dialog id="review"><div class="modal-head"><h2>Ghi bữa ăn</h2><button class="icon close" aria-label="Đóng">×</button></div><div id="preview-wrap"><img id="preview" alt="Ảnh món ăn vừa chọn"></div><p id="status" role="status"></p><div id="candidates"></div><button hidden id="retry" class="secondary">Thử nhận diện lại</button>
<form id="form" hidden><label>Bữa ăn<select id="kind"><option>Bữa sáng</option><option>Bữa trưa</option><option>Bữa tối</option><option>Bữa phụ</option></select></label><div id="foods"></div><button type="button" class="textbutton" id="add">＋ Thêm món</button><div class="calc"><span>Năng lượng ước tính</span><strong id="estimate">—</strong></div><button class="primary save">Lưu vào nhật ký</button></form></dialog>
<dialog id="info"><div class="modal-head"><h2 id="info-title"></h2><button class="icon close" aria-label="Đóng">×</button></div><div id="info-body"></div></dialog>
<dialog id="portion-editor" class="macro editor" aria-labelledby="portion-title">
  <form>
    <div class="editor-head"><h2 id="portion-title">Sửa khẩu phần</h2></div>
    <p class="portion-food-name"></p>
    <label><span class="portion-label"></span><input name="amount" type="text" inputmode="decimal" autocomplete="off" required autofocus></label>
    <p class="feedback" role="alert"></p>
    <div class="portion-actions"><button type="button" class="camera-action">Hủy</button><button type="submit" class="m-action">Lưu khẩu phần</button></div>
  </form>
</dialog>
<datalist id="catalog"></datalist></body></html>
